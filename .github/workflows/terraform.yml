name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI
  # =========================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_ami_id: ami-0b6d9d3d33ba97d99

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Check AWS secrets safely
      - name: Check AWS Secret Format
        shell: bash
        env:
          CHECK_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          CHECK_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$CHECK_ACCESS_KEY" ]; then
            echo "AWS_ACCESS_KEY_ID is EMPTY"
            exit 1
          fi

          if [ -z "$CHECK_SECRET_KEY" ]; then
            echo "AWS_SECRET_ACCESS_KEY is EMPTY"
            exit 1
          fi

          echo "AWS_ACCESS_KEY_ID is present"
          echo "Access key length: ${#CHECK_ACCESS_KEY}"

          echo "AWS_SECRET_ACCESS_KEY is present"
          echo "Secret key length: ${#CHECK_SECRET_KEY}"

          if [[ "$CHECK_ACCESS_KEY" == *"/"* ]]; then
            echo "ACCESS KEY contains '/'"
            exit 1
          fi

          if [[ "$CHECK_ACCESS_KEY" == *" "* ]]; then
            echo "ACCESS KEY contains spaces"
            exit 1
          fi

          echo "Access key format looks valid"

      # 4. Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 5. Verify AWS connection
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 6. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 7. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 8. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false


  # =========================
  # CD
  # =========================
  terraform-cd:
    name: Terraform CD
    needs: terraform-ci
    runs-on: ubuntu-latest

    # Manual approval environment
    environment:
      name: production

    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_ami_id: ami-0b6d9d3d33ba97d99

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 4. Verify AWS connection
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 6. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false

      # 7. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false